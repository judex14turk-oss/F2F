<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--tg-theme-bg-color, #1a1a2e);
            color: var(--tg-theme-text-color, #ffffff);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 400px;
            margin: 0 auto;
        }
        
        h1 {
            text-align: center;
            margin-bottom: 30px;
            font-size: 24px;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            color: var(--tg-theme-hint-color, #aaa);
        }
        
        input {
            width: 100%;
            padding: 15px;
            border: 1px solid var(--tg-theme-hint-color, #444);
            border-radius: 12px;
            font-size: 16px;
            background: var(--tg-theme-secondary-bg-color, #252542);
            color: var(--tg-theme-text-color, #fff);
        }
        
        input:focus {
            outline: none;
            border-color: var(--tg-theme-button-color, #4ea8de);
        }
        
        .error {
            background: rgba(255, 100, 100, 0.2);
            color: #ff6b6b;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            text-align: center;
        }
        
        .success {
            background: rgba(100, 255, 100, 0.2);
            color: #6bff6b;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            text-align: center;
        }
        
        .btn {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 12px;
            font-size: 17px;
            font-weight: 600;
            cursor: pointer;
            background: var(--tg-theme-button-color, #4ea8de);
            color: var(--tg-theme-button-text-color, #fff);
        }
        
        .link {
            text-align: center;
            margin-top: 20px;
        }
        
        .link a {
            color: var(--tg-theme-link-color, #4ea8de);
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔑 Вход</h1>
        
        {% if error %}
        <div class="error">{{ error }}</div>
        {% endif %}
        
        <form method="POST" id="loginForm">
            <input type="hidden" name="tg_id" value="{{ tg_id }}">
            <input type="hidden" name="seller_type" value="{{ seller_type }}">
            
            <div class="form-group">
                <label>Email или телефон</label>
                <input type="text" name="login" placeholder="+998 XX XXX XX XX" required>
            </div>
            
            <div class="form-group">
                <label>Пароль</label>
                <input type="password" name="password" placeholder="Ваш пароль" required>
            </div>
            
            <button type="submit" class="btn">Войти</button>
        </form>
        
        <div class="link">
            <a href="/webapp/register?type={{ seller_type }}&tg_id={{ tg_id }}">Нет аккаунта? Регистрация</a>
        </div>
    </div>
    
    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();
        
        tg.BackButton.show();
        tg.BackButton.onClick(() => {
            window.history.back();
        });
    </script>
</body>
</html>
