<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Редактирование пользователя</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--tg-theme-bg-color, #f5f5f5);
            color: var(--tg-theme-text-color, #000);
            padding-bottom: 20px;
        }
        
        .header {
            background: white;
            padding: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
            border-bottom: 1px solid #eee;
            margin-bottom: 15px;
        }
        
        .back-btn {
            background: none;
            border: none;
            font-size: 1.2rem;
            color: var(--tg-theme-button-color, #5288c1);
            cursor: pointer;
            text-decoration: none;
        }
        
        .header-title {
            font-weight: 600;
            font-size: 1.1rem;
        }
        
        .user-info {
            background: white;
            margin: 0 15px 15px;
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }
        
        .user-name {
            font-weight: 600;
            font-size: 1.1rem;
            margin-bottom: 5px;
        }
        
        .user-details {
            color: #666;
            font-size: 0.9rem;
        }
        
        .form-section {
            background: white;
            margin: 0 15px 15px;
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }
        
        .form-group {
            margin-bottom: 15px;
        }
        
        .form-group:last-child {
            margin-bottom: 0;
        }
        
        .form-label {
            display: block;
            font-size: 0.85rem;
            color: #666;
            margin-bottom: 6px;
            font-weight: 500;
        }
        
        .form-select {
            width: 100%;
            padding: 12px;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            font-size: 1rem;
            background: white;
        }
        
        .btn-save {
            width: 100%;
            background: #10b981;
            color: white;
            border: none;
            padding: 14px;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            margin: 0 15px;
            width: calc(100% - 30px);
        }
        
        .btn-save:active {
            background: #059669;
        }
    </style>
</head>
<body>
    <div class="header">
        <a href="{{ url_for('webapp_admin', tg_id=tg_id) }}" class="back-btn">
            <i class="bi bi-arrow-left"></i>
        </a>
        <span class="header-title">Редактирование пользователя</span>
    </div>
    
    <div class="user-info">
        <div class="user-name">{{ user.first_name or '-' }} {{ user.last_name or '' }}</div>
        <div class="user-details">
            ID: {{ user.telegram_id }}
            {% if user.username %}| @{{ user.username }}{% endif %}
            {% if user.phone %}| {{ user.phone }}{% endif %}
        </div>
    </div>
    
    <form method="POST" action="{{ url_for('webapp_user_save', user_id=user.id) }}">
        <input type="hidden" name="tg_id" value="{{ tg_id }}">
        
        <div class="form-section">
            <div class="form-group">
                <label class="form-label">Роль пользователя</label>
                <select name="role" class="form-select">
                    <option value="buyer" {% if user.role and user.role.value == 'buyer' %}selected{% endif %}>Покупатель</option>
                    <option value="seller" {% if user.role and user.role.value == 'seller' %}selected{% endif %}>Продавец</option>
                </select>
            </div>
            
            {% if permissions.can_edit_tariff %}
            <div class="form-group">
                <label class="form-label">Тариф</label>
                <select name="tariff" class="form-select">
                    <option value="free" {% if user.tariff and user.tariff.value|lower == 'free' %}selected{% endif %}>Бесплатный</option>
                    <option value="agency_start" {% if user.tariff and user.tariff.value|lower == 'agency_start' %}selected{% endif %}>Агентство</option>
                    <option value="developer_pro" {% if user.tariff and user.tariff.value|lower == 'developer_pro' %}selected{% endif %}>Застройщик</option>
                    <option value="pro" {% if user.tariff and user.tariff.value|lower == 'pro' %}selected{% endif %}>PRO</option>
                    <option value="premium" {% if user.tariff and user.tariff.value|lower == 'premium' %}selected{% endif %}>Premium</option>
                </select>
            </div>
            {% endif %}
        </div>
        
        <button type="submit" class="btn-save">
            <i class="bi bi-check-lg"></i> Сохранить
        </button>
    </form>
    
    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();
        
        document.body.style.setProperty('--tg-theme-bg-color', tg.themeParams.bg_color || '#f5f5f5');
        document.body.style.setProperty('--tg-theme-text-color', tg.themeParams.text_color || '#000000');
        document.body.style.setProperty('--tg-theme-button-color', tg.themeParams.button_color || '#5288c1');
    </script>
</body>
</html>
