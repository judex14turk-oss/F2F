<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>{{ title }}</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            background: #0a0a0a;
            color: #e5e5e5;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            padding-bottom: 30px;
        }
        
        .header {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            padding: 20px 16px;
            border-bottom: 1px solid #2a2a2a;
        }
        
        .header h1 {
            font-size: 1.2rem;
            font-weight: 600;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .nav-tabs {
            display: flex;
            gap: 4px;
            padding: 12px;
            background: #111;
            overflow-x: auto;
        }
        
        .nav-tab {
            flex: 1;
            text-align: center;
            padding: 10px 6px;
            background: #1a1a1a;
            border-radius: 8px;
            text-decoration: none;
            color: #888;
            font-size: 0.7rem;
            white-space: nowrap;
            border: 1px solid #2a2a2a;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }
        
        .nav-tab i {
            font-size: 1.1rem;
        }
        
        .nav-tab.active {
            background: #3b82f6;
            color: white;
            border-color: #3b82f6;
        }
        
        .content {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 60px 20px;
            text-align: center;
        }
        
        .content i {
            font-size: 4rem;
            color: #3b82f6;
            margin-bottom: 20px;
        }
        
        .content h2 {
            font-size: 1.2rem;
            color: #fff;
            margin-bottom: 10px;
        }
        
        .content p {
            color: #888;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>
            {% if page == 'objects' %}<i class="bi bi-house"></i>
            {% elif page == 'subscription' %}<i class="bi bi-credit-card"></i>
            {% elif page == 'likes' %}<i class="bi bi-heart"></i>
            {% elif page == 'chats' %}<i class="bi bi-chat"></i>
            {% endif %}
            {{ title }}
        </h1>
    </div>
    
    <div class="nav-tabs">
        <a href="{{ url_for('webapp_user_objects', tg_id=tg_id) }}" class="nav-tab {% if page == 'objects' %}active{% endif %}">
            <i class="bi bi-house"></i>
            Объекты
        </a>
        <a href="{{ url_for('webapp_user_subscription', tg_id=tg_id) }}" class="nav-tab {% if page == 'subscription' %}active{% endif %}">
            <i class="bi bi-credit-card"></i>
            Подписка
        </a>
        <a href="{{ url_for('webapp_user_likes', tg_id=tg_id) }}" class="nav-tab {% if page == 'likes' %}active{% endif %}">
            <i class="bi bi-heart"></i>
            Лайки
        </a>
        <a href="{{ url_for('webapp_user_stats', tg_id=tg_id) }}" class="nav-tab">
            <i class="bi bi-graph-up"></i>
            Статистика
        </a>
    </div>
    
    <div class="content">
        <i class="bi bi-tools"></i>
        <h2>В разработке</h2>
        <p>Этот раздел скоро будет доступен</p>
    </div>
    
    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();
    </script>
</body>
</html>
