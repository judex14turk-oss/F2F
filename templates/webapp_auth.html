<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход / Регистрация</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--tg-theme-bg-color, #1a1a2e);
            color: var(--tg-theme-text-color, #ffffff);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .container {
            width: 100%;
            max-width: 400px;
        }
        
        .logo {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .logo h1 {
            font-size: 28px;
            margin-bottom: 8px;
        }
        
        .logo p {
            color: var(--tg-theme-hint-color, #888);
            font-size: 14px;
        }
        
        .seller-type {
            background: var(--tg-theme-secondary-bg-color, #252542);
            padding: 15px 20px;
            border-radius: 12px;
            margin-bottom: 30px;
            text-align: center;
        }
        
        .seller-type span {
            font-size: 16px;
            color: var(--tg-theme-hint-color, #aaa);
        }
        
        .seller-type strong {
            color: var(--tg-theme-link-color, #4ea8de);
        }
        
        .buttons {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        
        .btn {
            display: block;
            width: 100%;
            padding: 18px;
            border: none;
            border-radius: 12px;
            font-size: 17px;
            font-weight: 600;
            cursor: pointer;
            text-align: center;
            text-decoration: none;
            transition: transform 0.1s, opacity 0.1s;
        }
        
        .btn:active {
            transform: scale(0.98);
            opacity: 0.9;
        }
        
        .btn-primary {
            background: var(--tg-theme-button-color, #4ea8de);
            color: var(--tg-theme-button-text-color, #ffffff);
        }
        
        .btn-secondary {
            background: var(--tg-theme-secondary-bg-color, #252542);
            color: var(--tg-theme-text-color, #ffffff);
            border: 1px solid var(--tg-theme-hint-color, #444);
        }
        
        .divider {
            display: flex;
            align-items: center;
            margin: 20px 0;
        }
        
        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--tg-theme-hint-color, #444);
        }
        
        .divider span {
            padding: 0 15px;
            color: var(--tg-theme-hint-color, #888);
            font-size: 14px;
        }
        
        .info {
            margin-top: 30px;
            text-align: center;
            font-size: 13px;
            color: var(--tg-theme-hint-color, #888);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">
            <h1>🏢 Real Estate Bot</h1>
            <p>Платформа для профессионалов</p>
        </div>
        
        <div class="seller-type">
            <span>Вы выбрали: </span>
            <strong id="sellerType">{{ seller_type_name }}</strong>
        </div>
        
        <div class="buttons">
            <a href="/webapp/login?type={{ seller_type }}&tg_id={{ tg_id }}" class="btn btn-primary">
                🔑 Войти
            </a>
            
            <div class="divider">
                <span>или</span>
            </div>
            
            <a href="/webapp/register?type={{ seller_type }}&tg_id={{ tg_id }}" class="btn btn-secondary">
                📝 Регистрация
            </a>
        </div>
        
        <div class="info">
            <p>Для риелторов и застройщиков доступны<br>расширенные возможности и CRM</p>
        </div>
    </div>
    
    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();
        
        tg.MainButton.hide();
        
        tg.BackButton.show();
        tg.BackButton.onClick(() => {
            tg.close();
        });
    </script>
</body>
</html>
