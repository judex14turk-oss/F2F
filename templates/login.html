{% extends 'base.html' %}

{% block title %}Вход - Real Estate Bot{% endblock %}

{% block body %}
<div class="min-vh-100 d-flex align-items-center justify-content-center" style="background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-4">
                <div class="card shadow-lg">
                    <div class="card-body p-5">
                        <div class="text-center mb-4">
                            <h3><i class="bi bi-house-heart-fill text-primary"></i></h3>
                            <h4>Вход в систему</h4>
                            <p class="text-muted">Введите ваш Telegram ID</p>
                        </div>
                        
                        {% if error %}
                        <div class="alert alert-danger">{{ error }}</div>
                        {% endif %}
                        
                        <form method="POST">
                            <div class="mb-4">
                                <label class="form-label">Telegram ID</label>
                                <input type="text" name="telegram_id" class="form-control form-control-lg" placeholder="123456789" required>
                                <div class="form-text">Получите ID командой /start в боте</div>
                            </div>
                            <div class="d-grid">
                                <button type="submit" class="btn btn-primary btn-lg">
                                    <i class="bi bi-box-arrow-in-right"></i> Войти
                                </button>
                            </div>
                        </form>
                        
                        <div class="text-center mt-4">
                            <a href="{{ url_for('index') }}" class="text-muted">
                                <i class="bi bi-arrow-left"></i> На главную
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
