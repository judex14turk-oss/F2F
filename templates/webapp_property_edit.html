<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Редактирование объекта</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0a0a;
            color: #e5e5e5;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            padding-bottom: 120px;
        }
        .header {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            padding: 16px;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .btn-back {
            background: rgba(255,255,255,0.1);
            border: none;
            border-radius: 8px;
            padding: 10px 14px;
            color: white;
            text-decoration: none;
            font-size: 0.9rem;
        }
        .header h1 {
            font-size: 1.1rem;
            font-weight: 600;
            color: #fff;
        }
        .photos-slider {
            width: 100%;
            overflow-x: auto;
            white-space: nowrap;
            padding: 12px;
            background: #111;
        }
        .photos-slider img {
            width: 120px;
            height: 90px;
            object-fit: cover;
            border-radius: 8px;
            margin-right: 8px;
            display: inline-block;
        }
        .form-section {
            padding: 16px;
        }
        .form-card {
            background: #151515;
            border: 1px solid #252525;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 12px;
        }
        .form-title {
            font-size: 0.8rem;
            color: #888;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .form-group {
            margin-bottom: 14px;
        }
        .form-label {
            display: block;
            font-size: 0.8rem;
            color: #888;
            margin-bottom: 6px;
        }
        .form-input {
            width: 100%;
            background: #1a1a1a;
            border: 1px solid #2a2a2a;
            border-radius: 8px;
            padding: 12px;
            color: #e5e5e5;
            font-size: 0.9rem;
        }
        .form-input:focus {
            outline: none;
            border-color: #3b82f6;
        }
        .form-textarea {
            min-height: 100px;
            resize: vertical;
        }
        .form-row {
            display: flex;
            gap: 10px;
        }
        .form-row .form-group {
            flex: 1;
        }
        .action-buttons {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: #0a0a0a;
            padding: 12px 16px;
            border-top: 1px solid #252525;
        }
        .btn-row {
            display: flex;
            gap: 8px;
            margin-bottom: 8px;
        }
        .btn-action {
            flex: 1;
            padding: 14px;
            border: none;
            border-radius: 10px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        .btn-save { background: #10b981; color: white; }
        .btn-archive { background: #f59e0b; color: white; }
        .btn-delete { background: #ef4444; color: white; }
        .btn-activate { background: #3b82f6; color: white; }
    </style>
</head>
<body>
    <div class="header">
        <a href="{{ url_for('webapp_property_view', property_id=prop.id, tg_id=tg_id) }}" class="btn-back"><i class="bi bi-arrow-left"></i></a>
        <h1>Редактирование #{{ prop.unique_id or prop.id }}</h1>
    </div>
    
    {% if photos %}
    <div class="photos-slider">
        {% for photo in photos %}
        <img src="{{ photo }}" alt="Фото {{ loop.index }}">
        {% endfor %}
    </div>
    {% endif %}
    
    <form method="POST" action="{{ url_for('webapp_property_update', property_id=prop.id) }}" class="form-section">
        <input type="hidden" name="tg_id" value="{{ tg_id }}">
        
        <div class="form-card">
            <div class="form-title"><i class="bi bi-info-circle"></i> Основная информация</div>
            
            <div class="form-group">
                <label class="form-label">Название / ЖК</label>
                <input type="text" name="residential_complex" class="form-input" value="{{ prop.residential_complex or '' }}">
            </div>
            
            <div class="form-group">
                <label class="form-label">Район</label>
                <input type="text" name="district" class="form-input" value="{{ prop.district or '' }}">
            </div>
            
            <div class="form-group">
                <label class="form-label">Адрес</label>
                <input type="text" name="address" class="form-input" value="{{ prop.address or '' }}">
            </div>
            
            <div class="form-group">
                <label class="form-label">Цена ($)</label>
                <input type="number" name="price" class="form-input" value="{{ prop.price }}">
            </div>
            
            <div class="form-group">
                <label class="form-label">Телефон</label>
                <input type="text" name="phone" class="form-input" value="{{ prop.phone or '' }}">
            </div>
        </div>
        
        <div class="form-card">
            <div class="form-title"><i class="bi bi-house"></i> Характеристики</div>
            
            <div class="form-row">
                <div class="form-group">
                    <label class="form-label">Комнат</label>
                    <input type="number" name="rooms" class="form-input" value="{{ prop.rooms or '' }}">
                </div>
                <div class="form-group">
                    <label class="form-label">Площадь (м²)</label>
                    <input type="number" step="0.1" name="area" class="form-input" value="{{ prop.area or '' }}">
                </div>
            </div>
            
            <div class="form-row">
                <div class="form-group">
                    <label class="form-label">Этаж</label>
                    <input type="number" name="floor" class="form-input" value="{{ prop.floor or '' }}">
                </div>
                <div class="form-group">
                    <label class="form-label">Этажность</label>
                    <input type="number" name="total_floors" class="form-input" value="{{ prop.total_floors or '' }}">
                </div>
            </div>
        </div>
        
        <div class="form-card">
            <div class="form-title"><i class="bi bi-text-paragraph"></i> Описание</div>
            <div class="form-group">
                <textarea name="description" class="form-input form-textarea">{{ prop.description or '' }}</textarea>
            </div>
        </div>
        
        <div class="action-buttons">
            <div class="btn-row">
                <button type="submit" class="btn-action btn-save">
                    <i class="bi bi-check"></i> Сохранить
                </button>
            </div>
            <div class="btn-row">
                {% if prop.status.value != 'active' %}
                <button type="submit" formaction="{{ url_for('webapp_approve_property', property_id=prop.id) }}" class="btn-action btn-activate">
                    <i class="bi bi-check-circle"></i> Активировать
                </button>
                {% endif %}
                {% if prop.status.value != 'archive' %}
                <button type="submit" formaction="{{ url_for('webapp_reject_property', property_id=prop.id) }}" class="btn-action btn-archive">
                    <i class="bi bi-archive"></i> В архив
                </button>
                {% endif %}
                <button type="submit" formaction="{{ url_for('webapp_property_delete', property_id=prop.id) }}" class="btn-action btn-delete" onclick="return confirm('Удалить объект навсегда?')">
                    <i class="bi bi-trash"></i> Удалить
                </button>
            </div>
        </div>
    </form>
    
    <script>
        if (window.Telegram && window.Telegram.WebApp) {
            Telegram.WebApp.ready();
            Telegram.WebApp.expand();
        }
    </script>
</body>
</html>
