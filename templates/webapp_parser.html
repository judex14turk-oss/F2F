<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Парсинг OLX</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0a0a;
            color: #e5e5e5;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            padding-bottom: 100px;
        }
        .header {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            padding: 20px 16px;
            border-bottom: 1px solid #2a2a2a;
        }
        .header h1 {
            font-size: 1.2rem;
            font-weight: 600;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .header-role {
            font-size: 0.8rem;
            color: #888;
            margin-top: 4px;
        }
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: #111;
            border-top: 1px solid #2a2a2a;
            display: flex;
            justify-content: space-around;
            padding: 8px 0;
            z-index: 100;
        }
        .bottom-nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none;
            color: #666;
            font-size: 0.65rem;
            padding: 4px 8px;
        }
        .bottom-nav-item.active {
            color: #3b82f6;
        }
        .bottom-nav-item i {
            font-size: 1.3rem;
            margin-bottom: 2px;
        }
        .content { padding: 16px; }
        .filter-card {
            background: #151515;
            border: 1px solid #252525;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 16px;
        }
        .filter-title {
            font-size: 1rem;
            font-weight: 600;
            color: #fff;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .filter-group {
            margin-bottom: 16px;
        }
        .filter-label {
            display: block;
            font-size: 0.8rem;
            color: #888;
            margin-bottom: 8px;
        }
        .filter-select {
            width: 100%;
            padding: 12px;
            background: #1a1a1a;
            border: 1px solid #2a2a2a;
            border-radius: 8px;
            color: #e5e5e5;
            font-size: 0.9rem;
        }
        .filter-select:focus {
            outline: none;
            border-color: #3b82f6;
        }
        .toggle-group {
            display: flex;
            gap: 8px;
        }
        .toggle-btn {
            flex: 1;
            padding: 12px;
            background: #1a1a1a;
            border: 1px solid #2a2a2a;
            border-radius: 8px;
            color: #888;
            font-size: 0.85rem;
            cursor: pointer;
            text-align: center;
            transition: all 0.2s;
        }
        .toggle-btn.active {
            background: #10b981;
            border-color: #10b981;
            color: white;
        }
        .rooms-group {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }
        .room-btn {
            width: 48px;
            height: 48px;
            background: #1a1a1a;
            border: 1px solid #2a2a2a;
            border-radius: 8px;
            color: #888;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        .room-btn.active {
            background: #3b82f6;
            border-color: #3b82f6;
            color: white;
        }
        .btn-parse {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            border: none;
            border-radius: 10px;
            color: white;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .btn-parse:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .results-section {
            display: none;
        }
        .results-section.visible { display: block; }
        .results-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }
        .results-title {
            font-size: 1rem;
            font-weight: 600;
            color: #fff;
        }
        .results-count {
            font-size: 0.8rem;
            color: #10b981;
            background: rgba(16, 185, 129, 0.1);
            padding: 4px 10px;
            border-radius: 12px;
        }
        .listing-card {
            background: #151515;
            border: 1px solid #252525;
            border-radius: 12px;
            margin-bottom: 12px;
            overflow: hidden;
        }
        .listing-photos {
            display: flex;
            overflow-x: auto;
            gap: 2px;
        }
        .listing-photo {
            width: 120px;
            height: 90px;
            object-fit: cover;
            flex-shrink: 0;
        }
        .listing-body { padding: 14px; }
        .listing-title {
            font-size: 0.9rem;
            font-weight: 600;
            color: #fff;
            margin-bottom: 6px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .listing-price {
            font-size: 1.1rem;
            font-weight: 700;
            color: #4ade80;
            margin-bottom: 10px;
        }
        .listing-params {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-bottom: 10px;
        }
        .param-badge {
            background: #1a1a1a;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.75rem;
            color: #aaa;
        }
        .listing-phone {
            display: flex;
            align-items: center;
            gap: 6px;
            color: #10b981;
            font-weight: 600;
            font-size: 0.9rem;
        }
        .listing-location {
            font-size: 0.75rem;
            color: #666;
            margin-top: 8px;
        }
        .loading-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.85);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        .loading-overlay.visible { display: flex; }
        .spinner {
            width: 50px;
            height: 50px;
            border: 3px solid #333;
            border-top-color: #10b981;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 16px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .loading-text { color: #fff; font-size: 0.9rem; }
        .loading-progress { color: #888; font-size: 0.8rem; margin-top: 8px; }
        .error-msg {
            background: rgba(220, 38, 38, 0.1);
            border: 1px solid rgba(220, 38, 38, 0.3);
            color: #f87171;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 16px;
            font-size: 0.85rem;
            display: none;
        }
        .error-msg.visible { display: block; }
        .apartment-options { display: block; }
        .apartment-options.hidden { display: none; }
    </style>
</head>
<body>
    <div class="header">
        <h1><i class="bi bi-cloud-download"></i> Парсинг OLX</h1>
        <div class="header-role">{{ permissions.role_name }}</div>
    </div>
    
    
    <div class="content">
        <div class="filter-card" style="margin-bottom: 16px;">
            <div class="filter-title"><i class="bi bi-link-45deg"></i> Парсинг по ссылке</div>
            
            <div class="filter-group">
                <label class="filter-label">Вставьте ссылку на объявление OLX</label>
                <input type="text" class="filter-select" id="singleUrl" placeholder="https://www.olx.uz/d/obyavlenie/..." style="margin-bottom: 8px;">
            </div>
            
            <!-- Phone extraction disabled -->
            <input type="hidden" id="singleGetPhone" value="false">
            
            <div class="error-msg" id="singleErrorMsg"></div>
            
            <button class="btn-parse" id="singleParseBtn" onclick="parseSingleListing()" style="background: #3b82f6;">
                <i class="bi bi-download"></i> Спарсить объявление
            </button>
        </div>
        
        <div class="filter-card">
            <div class="filter-title"><i class="bi bi-funnel"></i> Фильтры</div>
            
            <div class="filter-group">
                <label class="filter-label">Тип сделки</label>
                <div class="toggle-group">
                    <div class="toggle-btn active" data-value="sale" onclick="setDealType(this)">
                        <i class="bi bi-tag"></i> Продажа
                    </div>
                    <div class="toggle-btn" data-value="rent" onclick="setDealType(this)">
                        <i class="bi bi-key"></i> Аренда
                    </div>
                </div>
            </div>
            
            <div class="filter-group">
                <label class="filter-label">Тип недвижимости</label>
                <div class="toggle-group">
                    <div class="toggle-btn active" data-value="apartment" onclick="setPropertyType(this)">
                        <i class="bi bi-building"></i> Квартира
                    </div>
                    <div class="toggle-btn" data-value="house" onclick="setPropertyType(this)">
                        <i class="bi bi-house"></i> Дом
                    </div>
                    <div class="toggle-btn" data-value="land" onclick="setPropertyType(this)">
                        <i class="bi bi-geo-alt"></i> Участок
                    </div>
                </div>
            </div>
            
            <div class="filter-group">
                <label class="filter-label">Район Ташкента</label>
                <select class="filter-select" id="districtSelect">
                    <option value="all">Все районы</option>
                    <option value="mirabad">Мирабадский</option>
                    <option value="yunusabad">Юнусабадский</option>
                    <option value="chilanzar">Чиланзарский</option>
                    <option value="yakkasaray">Яккасарайский</option>
                    <option value="sergeli">Сергелийский</option>
                    <option value="shaykhantakhur">Шайхантахурский</option>
                    <option value="uchtepa">Учтепинский</option>
                    <option value="yashnabad">Яшнабадский</option>
                    <option value="olmazor">Олмазорский</option>
                    <option value="mirzo_ulugbek">Мирзо-Улугбекский</option>
                    <option value="bektemir">Бектемирский</option>
                    <option value="yangihayot">Янгихаётский</option>
                    <option value="noviy_tashkent">Новый Ташкент</option>
                </select>
            </div>
            
            <div class="apartment-options" id="apartmentOptions">
                <div class="filter-group">
                    <label class="filter-label">Количество комнат</label>
                    <div class="rooms-group">
                        <div class="room-btn" data-value="" onclick="setRooms(this)">Все</div>
                        <div class="room-btn" data-value="1" onclick="setRooms(this)">1</div>
                        <div class="room-btn" data-value="2" onclick="setRooms(this)">2</div>
                        <div class="room-btn" data-value="3" onclick="setRooms(this)">3</div>
                        <div class="room-btn" data-value="4" onclick="setRooms(this)">4</div>
                        <div class="room-btn" data-value="5" onclick="setRooms(this)">5+</div>
                    </div>
                </div>
                
                <div class="filter-group">
                    <label class="filter-label">Тип жилья</label>
                    <div class="toggle-group">
                        <div class="toggle-btn active" data-value="all" onclick="setHousingType(this)">Все</div>
                        <div class="toggle-btn" data-value="new" onclick="setHousingType(this)">Новостройка</div>
                        <div class="toggle-btn" data-value="secondary" onclick="setHousingType(this)">Вторичка</div>
                    </div>
                </div>
            </div>
            
            <div class="filter-group">
                <label class="filter-label">Дата публикации</label>
                <select class="filter-select" id="maxDays">
                    <option value="1">За сегодня</option>
                    <option value="3">За 3 дня</option>
                    <option value="7" selected>За неделю</option>
                    <option value="14">За 2 недели</option>
                    <option value="0">Все даты</option>
                </select>
            </div>
            
            <div class="filter-group">
                <label class="filter-label">Макс. объявлений</label>
                <select class="filter-select" id="maxListings">
                    <option value="10">10 объявлений</option>
                    <option value="20">20 объявлений</option>
                    <option value="50" selected>50 объявлений</option>
                    <option value="100">100 объявлений</option>
                    <option value="200">200 объявлений</option>
                    <option value="500">500 объявлений</option>
                    <option value="1000">Все (макс 1000)</option>
                </select>
            </div>
            
            <div class="filter-group">
                <label class="filter-label">
                    <input type="checkbox" id="getPhoneCheck"> 
                    Получать телефоны (медленнее, ~30 сек/объявление)
                </label>
            </div>
            
            <div class="error-msg" id="errorMsg"></div>
            
            <button class="btn-parse" id="parseBtn" onclick="startParsing()">
                <i class="bi bi-play-fill"></i> Запустить парсинг
            </button>
        </div>
        
        <div class="results-section" id="resultsSection">
            <div class="results-header">
                <div class="results-title">Результаты</div>
                <div class="results-count" id="resultsCount">0 найдено</div>
            </div>
            <div id="listingsContainer"></div>
        </div>
    </div>
    
    <div class="loading-overlay" id="loadingOverlay">
        <div class="spinner"></div>
        <div class="loading-text" id="loadingText">Парсинг объявлений...</div>
        <div class="loading-progress" id="loadingProgress">0 / 0</div>
    </div>
    
    <script>
        if (window.Telegram && window.Telegram.WebApp) {
            Telegram.WebApp.ready();
            Telegram.WebApp.expand();
        }
        
        let filters = {
            deal_type: 'sale',
            property_type: 'apartment',
            district: 'all',
            rooms: '',
            housing_type: 'all'
        };
        
        function setDealType(el) {
            document.querySelectorAll('[data-value="sale"], [data-value="rent"]').forEach(b => {
                if (b.parentElement.querySelector('[data-value="sale"]') && b.parentElement.querySelector('[data-value="rent"]')) {
                    b.classList.remove('active');
                }
            });
            el.classList.add('active');
            filters.deal_type = el.dataset.value;
        }
        
        function setPropertyType(el) {
            el.parentElement.querySelectorAll('.toggle-btn').forEach(b => b.classList.remove('active'));
            el.classList.add('active');
            filters.property_type = el.dataset.value;
            
            const opts = document.getElementById('apartmentOptions');
            if (el.dataset.value === 'apartment') {
                opts.classList.remove('hidden');
            } else {
                opts.classList.add('hidden');
            }
        }
        
        function setRooms(el) {
            el.parentElement.querySelectorAll('.room-btn').forEach(b => b.classList.remove('active'));
            el.classList.add('active');
            filters.rooms = el.dataset.value;
        }
        
        function setHousingType(el) {
            el.parentElement.querySelectorAll('.toggle-btn').forEach(b => b.classList.remove('active'));
            el.classList.add('active');
            filters.housing_type = el.dataset.value;
        }
        
        function startParsing() {
            const btn = document.getElementById('parseBtn');
            const overlay = document.getElementById('loadingOverlay');
            const errorMsg = document.getElementById('errorMsg');
            const loadingProgress = document.getElementById('loadingProgress');
            const loadingText = document.getElementById('loadingText');
            
            btn.disabled = true;
            overlay.classList.add('visible');
            errorMsg.classList.remove('visible');
            
            const maxListingsVal = parseInt(document.getElementById('maxListings').value);
            loadingProgress.textContent = `0 / ${maxListingsVal}`;
            loadingText.textContent = 'Получение списка объявлений...';
            
            const params = new URLSearchParams({
                tg_id: '{{ tg_id }}',
                deal_type: filters.deal_type,
                property_type: filters.property_type,
                district: document.getElementById('districtSelect').value,
                rooms: filters.property_type === 'apartment' ? filters.rooms : '',
                housing_type: filters.property_type === 'apartment' ? filters.housing_type : 'all',
                max_listings: document.getElementById('maxListings').value,
                max_days: document.getElementById('maxDays').value,
                get_phone: document.getElementById('getPhoneCheck').checked ? 'true' : 'false'
            });
            
            const eventSource = new EventSource('/webapp/admin/parser/run-stream?' + params.toString());
            
            eventSource.onmessage = function(event) {
                const data = JSON.parse(event.data);
                
                if (data.error) {
                    errorMsg.textContent = data.error;
                    errorMsg.classList.add('visible');
                    eventSource.close();
                    btn.disabled = false;
                    overlay.classList.remove('visible');
                    return;
                }
                
                if (data.event === 'start') {
                    loadingText.textContent = 'Парсинг объявлений...';
                    loadingProgress.textContent = `0 / ${data.total}`;
                }
                
                if (data.event === 'progress') {
                    loadingProgress.textContent = `${data.current} / ${data.total} (добавлено: ${data.added})`;
                }
                
                if (data.event === 'complete') {
                    eventSource.close();
                    displayResults(data);
                    btn.disabled = false;
                    overlay.classList.remove('visible');
                }
                
                if (data.event === 'error') {
                    errorMsg.textContent = 'Ошибка: ' + data.error;
                    errorMsg.classList.add('visible');
                    eventSource.close();
                    btn.disabled = false;
                    overlay.classList.remove('visible');
                }
            };
            
            eventSource.onerror = function(event) {
                errorMsg.textContent = 'Ошибка соединения';
                errorMsg.classList.add('visible');
                eventSource.close();
                btn.disabled = false;
                overlay.classList.remove('visible');
            };
        }
        
        function displayResults(result) {
            const section = document.getElementById('resultsSection');
            const container = document.getElementById('listingsContainer');
            const count = document.getElementById('resultsCount');
            
            section.classList.add('visible');
            let statsText = `Добавлено: ${result.added_to_db || 0} из ${result.parsed}`;
            if (result.skipped_duplicates > 0) {
                statsText += ` (дубли: ${result.skipped_duplicates})`;
            }
            if (result.skipped_old > 0) {
                statsText += ` (старые: ${result.skipped_old})`;
            }
            if (result.skipped_no_phone > 0) {
                statsText += ` (без телефона: ${result.skipped_no_phone})`;
            }
            count.textContent = statsText;
            container.innerHTML = '';
            
            if (result.skipped_urls && result.skipped_urls.length > 0) {
                let skippedHtml = '<div style="background:#1a1a1a;border:1px solid #333;border-radius:8px;padding:12px;margin-bottom:16px;">';
                skippedHtml += '<div style="color:#f87171;font-weight:600;margin-bottom:8px;">Пропущенные объявления:</div>';
                
                const noPhoneUrls = result.skipped_urls.filter(s => s.reason === 'no_phone');
                const duplicateUrls = result.skipped_urls.filter(s => s.reason === 'duplicate');
                
                if (noPhoneUrls.length > 0) {
                    skippedHtml += '<div style="color:#888;font-size:0.8rem;margin-bottom:4px;">Без телефона:</div>';
                    noPhoneUrls.forEach(item => {
                        skippedHtml += `<div style="margin-bottom:4px;"><a href="${item.url}" target="_blank" style="color:#60a5fa;font-size:0.75rem;word-break:break-all;">${item.title || item.url}</a></div>`;
                    });
                }
                
                if (duplicateUrls.length > 0) {
                    skippedHtml += '<div style="color:#888;font-size:0.8rem;margin-top:8px;margin-bottom:4px;">Дубликаты:</div>';
                    duplicateUrls.forEach(item => {
                        skippedHtml += `<div style="margin-bottom:4px;"><a href="${item.url}" target="_blank" style="color:#fbbf24;font-size:0.75rem;word-break:break-all;">${item.title || item.url}</a></div>`;
                    });
                }
                
                skippedHtml += '</div>';
                container.innerHTML = skippedHtml;
            }
            
            if (!result.listings || result.listings.length === 0) {
                if (!result.skipped_urls || result.skipped_urls.length === 0) {
                    container.innerHTML = '<div style="text-align:center;color:#666;padding:20px;">Объявления не найдены</div>';
                }
                return;
            }
            
            result.listings.forEach(listing => {
                if (listing.error && !listing.title) return;
                
                const card = document.createElement('div');
                card.className = 'listing-card';
                
                let photosHtml = '';
                if (listing.photos && listing.photos.length > 0) {
                    photosHtml = '<div class="listing-photos">';
                    listing.photos.slice(0, 5).forEach(url => {
                        photosHtml += `<img src="${url}" class="listing-photo" onerror="this.style.display='none'">`;
                    });
                    photosHtml += '</div>';
                }
                
                let paramsHtml = '<div class="listing-params">';
                if (listing.rooms) paramsHtml += `<span class="param-badge">${listing.rooms} комн.</span>`;
                if (listing.total_area) paramsHtml += `<span class="param-badge">${listing.total_area} м²</span>`;
                if (listing.floor) paramsHtml += `<span class="param-badge">${listing.floor}${listing.total_floors ? '/' + listing.total_floors : ''} этаж</span>`;
                if (listing.property_type) paramsHtml += `<span class="param-badge">${listing.property_type}</span>`;
                paramsHtml += '</div>';
                
                let phoneHtml = '';
                if (listing.phone) {
                    phoneHtml = `<div class="listing-phone"><i class="bi bi-telephone-fill"></i> ${listing.phone}</div>`;
                }
                
                card.innerHTML = `
                    ${photosHtml}
                    <div class="listing-body">
                        <div class="listing-title">${listing.title || 'Без названия'}</div>
                        <div class="listing-price">${listing.price || '-'} ${listing.currency || ''}</div>
                        ${paramsHtml}
                        ${phoneHtml}
                        <div class="listing-location"><i class="bi bi-geo-alt"></i> ${listing.location || '-'}</div>
                    </div>
                `;
                
                card.onclick = () => window.open(listing.url, '_blank');
                card.style.cursor = 'pointer';
                
                container.appendChild(card);
            });
            
            section.scrollIntoView({ behavior: 'smooth' });
        }
        
        async function parseSingleListing() {
            const btn = document.getElementById('singleParseBtn');
            const overlay = document.getElementById('loadingOverlay');
            const errorMsg = document.getElementById('singleErrorMsg');
            const url = document.getElementById('singleUrl').value.trim();
            
            if (!url) {
                errorMsg.textContent = 'Введите ссылку на объявление';
                errorMsg.classList.add('visible');
                return;
            }
            
            if (!url.includes('olx.uz')) {
                errorMsg.textContent = 'Ссылка должна быть с сайта olx.uz';
                errorMsg.classList.add('visible');
                return;
            }
            
            btn.disabled = true;
            overlay.classList.add('visible');
            errorMsg.classList.remove('visible');
            document.getElementById('loadingText').textContent = 'Парсинг объявления...';
            document.getElementById('loadingProgress').textContent = '';
            
            const data = {
                tg_id: '{{ tg_id }}',
                url: url,
                get_phone: document.getElementById('singleGetPhone').checked
            };
            
            try {
                const response = await fetch('/webapp/admin/parser/single', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                
                const result = await response.json();
                
                if (result.error) {
                    errorMsg.textContent = result.error;
                    errorMsg.classList.add('visible');
                } else {
                    document.getElementById('singleUrl').value = '';
                    displayResults(result);
                }
            } catch (err) {
                errorMsg.textContent = 'Ошибка: ' + err.message;
                errorMsg.classList.add('visible');
            } finally {
                btn.disabled = false;
                overlay.classList.remove('visible');
            }
        }
    </script>
