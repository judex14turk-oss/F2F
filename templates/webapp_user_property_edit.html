<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Редактирование объекта</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            background: #0a0a0a;
            color: #e5e5e5;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            padding-bottom: 100px;
        }
        
        .header {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            padding: 16px;
            border-bottom: 1px solid #2a2a2a;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        .back-btn {
            color: #3b82f6;
            font-size: 1.4rem;
            text-decoration: none;
        }
        
        .header h1 {
            font-size: 1.1rem;
            font-weight: 600;
            color: #fff;
        }
        
        .property-preview {
            padding: 16px;
            background: #151515;
            border-bottom: 1px solid #252525;
            display: flex;
            gap: 12px;
            align-items: center;
        }
        
        .property-preview img {
            width: 60px;
            height: 60px;
            border-radius: 8px;
            object-fit: cover;
            background: #1a1a1a;
        }
        
        .property-preview-info {
            flex: 1;
        }
        
        .property-preview-id {
            font-size: 0.75rem;
            color: #3b82f6;
            margin-bottom: 4px;
        }
        
        .property-preview-title {
            font-size: 0.9rem;
            color: #fff;
        }
        
        .form-container {
            padding: 16px;
        }
        
        .form-section {
            margin-bottom: 20px;
        }
        
        .form-section-title {
            font-size: 0.85rem;
            color: #3b82f6;
            margin-bottom: 12px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .form-group {
            margin-bottom: 14px;
        }
        
        .form-group label {
            display: block;
            font-size: 0.8rem;
            color: #888;
            margin-bottom: 6px;
        }
        
        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 12px;
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 8px;
            color: #fff;
            font-size: 0.95rem;
        }
        
        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #3b82f6;
        }
        
        .form-group textarea {
            min-height: 100px;
            resize: vertical;
        }
        
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }
        
        .form-row-3 {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 12px;
        }
        
        .submit-container {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 16px;
            background: linear-gradient(to top, #0a0a0a 80%, transparent);
        }
        
        .submit-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #3b82f6 0%, #8b5cf6 100%);
            border: none;
            border-radius: 12px;
            color: #fff;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        
        .submit-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        
        .success-message {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: #22c55e;
            color: #fff;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 0.9rem;
            display: none;
            z-index: 1000;
        }
        
        .error-message {
            background: #ef4444;
        }
        
        .discount-row {
            display: grid;
            grid-template-columns: 1fr 1fr auto;
            gap: 8px;
            margin-bottom: 10px;
            align-items: end;
        }
        
        .discount-row input {
            width: 100%;
            padding: 10px;
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 8px;
            color: #fff;
            font-size: 0.9rem;
        }
        
        .discount-row input:focus {
            outline: none;
            border-color: #3b82f6;
        }
        
        .discount-row label {
            font-size: 0.7rem;
            color: #888;
            margin-bottom: 4px;
            display: block;
        }
        
        .remove-discount-btn {
            background: #ef4444;
            border: none;
            border-radius: 8px;
            color: #fff;
            padding: 10px 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .add-discount-btn {
            background: #22c55e;
            border: none;
            border-radius: 8px;
            color: #fff;
            padding: 10px 16px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.85rem;
            margin-top: 8px;
        }
    </style>
</head>
<body>
    <div class="header">
        <a href="{{ url_for('webapp_user_objects', tg_id=tg_id) }}" class="back-btn">
            <i class="bi bi-arrow-left"></i>
        </a>
        <h1>Редактирование объекта</h1>
    </div>
    
    <div class="property-preview">
        {% if photo_url %}
        <img src="{{ photo_url }}" alt="Фото">
        {% else %}
        <div style="width: 60px; height: 60px; background: #1a1a1a; border-radius: 8px; display: flex; align-items: center; justify-content: center; color: #444;">
            <i class="bi bi-image" style="font-size: 1.5rem;"></i>
        </div>
        {% endif %}
        <div class="property-preview-info">
            <div class="property-preview-id">{{ prop.unique_id or ('F2F-' ~ '%05d'|format(prop.id)) }}</div>
            <div class="property-preview-title">{{ prop.rooms }}-комн., {{ prop.area }} м²</div>
        </div>
    </div>
    
    <div class="success-message" id="successMsg">Изменения сохранены!</div>
    
    <form class="form-container" id="editForm">
        <input type="hidden" name="property_id" value="{{ prop.id }}">
        
        <div class="form-section">
            <div class="form-section-title">
                <i class="bi bi-currency-dollar"></i> Цена и параметры
            </div>
            
            <div class="form-group">
                <label>Цена (сум)</label>
                <input type="number" name="price" value="{{ prop.price }}" required>
            </div>
            
            <div class="form-row">
                <div class="form-group">
                    <label>Комнат</label>
                    <input type="number" name="rooms" value="{{ prop.rooms }}" min="1" max="20">
                </div>
                <div class="form-group">
                    <label>Площадь (м²)</label>
                    <input type="number" name="area" value="{{ prop.area }}" step="0.1">
                </div>
            </div>
            
            <div class="form-row">
                <div class="form-group">
                    <label>Этаж</label>
                    <input type="number" name="floor" value="{{ prop.floor }}" min="1">
                </div>
                <div class="form-group">
                    <label>Всего этажей</label>
                    <input type="number" name="total_floors" value="{{ prop.total_floors }}" min="1">
                </div>
            </div>
        </div>
        
        <div class="form-section">
            <div class="form-section-title">
                <i class="bi bi-geo-alt"></i> Местоположение
            </div>
            
            <div class="form-group">
                <label>Район</label>
                <select name="district">
                    {% for d in districts %}
                    <option value="{{ d.name }}" {% if d.name == prop.district %}selected{% endif %}>{{ d.name }}</option>
                    {% endfor %}
                </select>
            </div>
            
            <div class="form-group">
                <label>Метро</label>
                <input type="text" name="metro_station" value="{{ prop.metro_station or '' }}" placeholder="Ближайшая станция метро">
            </div>
            
            <div class="form-group">
                <label>Адрес</label>
                <input type="text" name="address" value="{{ prop.address or '' }}" placeholder="Улица, дом">
            </div>
            
            <div class="form-group">
                <label>ЖК (жилой комплекс)</label>
                <input type="text" name="residential_complex" value="{{ prop.residential_complex or '' }}" placeholder="Название ЖК">
            </div>
        </div>
        
        <div class="form-section">
            <div class="form-section-title">
                <i class="bi bi-house"></i> Характеристики
            </div>
            
            <div class="form-group">
                <label>Ремонт</label>
                <select name="renovation">
                    <option value="">Не указано</option>
                    <option value="Евроремонт" {% if prop.renovation == 'Евроремонт' %}selected{% endif %}>Евроремонт</option>
                    <option value="Авторский дизайн" {% if prop.renovation == 'Авторский дизайн' %}selected{% endif %}>Авторский дизайн</option>
                    <option value="Средний ремонт" {% if prop.renovation == 'Средний ремонт' %}selected{% endif %}>Средний ремонт</option>
                    <option value="Черновая отделка" {% if prop.renovation == 'Черновая отделка' %}selected{% endif %}>Черновая отделка</option>
                    <option value="Чистовая отделка" {% if prop.renovation == 'Чистовая отделка' %}selected{% endif %}>Чистовая отделка</option>
                    <option value="Требуется ремонт" {% if prop.renovation == 'Требуется ремонт' %}selected{% endif %}>Требуется ремонт</option>
                </select>
            </div>
            
            <div class="form-group">
                <label>Тип дома</label>
                <select name="building_type">
                    <option value="">Не указано</option>
                    <option value="Кирпичный" {% if prop.building_type == 'Кирпичный' %}selected{% endif %}>Кирпичный</option>
                    <option value="Панельный" {% if prop.building_type == 'Панельный' %}selected{% endif %}>Панельный</option>
                    <option value="Монолитный" {% if prop.building_type == 'Монолитный' %}selected{% endif %}>Монолитный</option>
                    <option value="Блочный" {% if prop.building_type == 'Блочный' %}selected{% endif %}>Блочный</option>
                </select>
            </div>
            
            <div class="form-row">
                <div class="form-group">
                    <label>Тип комнат</label>
                    <select name="room_type">
                        <option value="">Не указано</option>
                        <option value="Раздельные" {% if prop.room_type == 'Раздельные' %}selected{% endif %}>Раздельные</option>
                        <option value="Смежные" {% if prop.room_type == 'Смежные' %}selected{% endif %}>Смежные</option>
                        <option value="Смежно-раздельные" {% if prop.room_type == 'Смежно-раздельные' %}selected{% endif %}>Смежно-раздельные</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Санузел</label>
                    <select name="bathroom_type">
                        <option value="">Не указано</option>
                        <option value="Раздельный" {% if prop.bathroom_type == 'Раздельный' %}selected{% endif %}>Раздельный</option>
                        <option value="Совмещённый" {% if prop.bathroom_type == 'Совмещённый' %}selected{% endif %}>Совмещённый</option>
                        <option value="2 и более" {% if prop.bathroom_type == '2 и более' %}selected{% endif %}>2 и более</option>
                    </select>
                </div>
            </div>
            
            <div class="form-group">
                <label>Мебель</label>
                <select name="has_furniture">
                    <option value="">Не указано</option>
                    <option value="true" {% if prop.has_furniture == true %}selected{% endif %}>Есть</option>
                    <option value="false" {% if prop.has_furniture == false and prop.has_furniture is not none %}selected{% endif %}>Нет</option>
                </select>
            </div>
            
            <div class="form-group">
                <label>Класс жилья</label>
                <select name="housing_class">
                    <option value="">Не указано</option>
                    <option value="Эконом" {% if prop.housing_class == 'Эконом' %}selected{% endif %}>Эконом</option>
                    <option value="Комфорт" {% if prop.housing_class == 'Комфорт' %}selected{% endif %}>Комфорт</option>
                    <option value="Бизнес" {% if prop.housing_class == 'Бизнес' %}selected{% endif %}>Бизнес</option>
                    <option value="Премиум" {% if prop.housing_class == 'Премиум' %}selected{% endif %}>Премиум</option>
                </select>
            </div>
            
            <div class="form-row">
                <div class="form-group">
                    <label>Балкон</label>
                    <select name="has_balcony">
                        <option value="">Не указано</option>
                        <option value="true" {% if prop.has_balcony == true %}selected{% endif %}>Есть</option>
                        <option value="false" {% if prop.has_balcony == false and prop.has_balcony is not none %}selected{% endif %}>Нет</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Площадь балкона (м²)</label>
                    <input type="number" name="balcony_area" value="{{ prop.balcony_area or '' }}" step="0.1" placeholder="0.0">
                </div>
            </div>
            
            <div class="form-group">
                <label>В стоимость входит</label>
                <input type="text" name="included_in_price" value="{{ prop.included_in_price or '' }}" placeholder="Окна, Котёл, ...">
            </div>
        </div>
        
        <div class="form-section">
            <div class="form-section-title">
                <i class="bi bi-cash-stack"></i> Условия оплаты
            </div>
            
            <div class="form-group">
                <label>Цена за м² (сум)</label>
                <input type="number" name="price_per_sqm" value="{{ prop.price_per_sqm or '' }}" placeholder="0">
            </div>
            
            <div class="form-row">
                <div class="form-group">
                    <label>Первоначальный взнос (%)</label>
                    <input type="number" name="down_payment_value" value="{{ prop.down_payment_value or '' }}" step="0.1" placeholder="0">
                </div>
                <div class="form-group">
                    <label>Тип взноса</label>
                    <select name="down_payment_type">
                        <option value="">Не указано</option>
                        <option value="percent" {% if prop.down_payment_type == 'percent' %}selected{% endif %}>Процент</option>
                        <option value="amount" {% if prop.down_payment_type == 'amount' %}selected{% endif %}>Сумма</option>
                    </select>
                </div>
            </div>
            
            <div class="form-group">
                <label>Методы оплаты</label>
                <input type="text" name="payment_methods" value="{{ prop.payment_methods or '' }}" placeholder="100% оплата, Ипотека, Рассрочка">
            </div>
            
            <div class="form-group">
                <label>Скидки</label>
                <div id="discounts-container">
                    <!-- Discount entries will be added here -->
                </div>
                <button type="button" class="add-discount-btn" onclick="addDiscountRow()">
                    <i class="bi bi-plus-circle"></i> Добавить скидку
                </button>
                <input type="hidden" name="discounts" id="discounts-hidden" value="{{ prop.discounts or '' }}">
            </div>
        </div>
        
        <div class="form-section">
            <div class="form-section-title">
                <i class="bi bi-bank"></i> Ипотека
            </div>
            
            <div class="form-row">
                <div class="form-group">
                    <label>Первый взнос (%)</label>
                    <input type="number" name="mortgage_down_payment" value="{{ prop.mortgage_down_payment or '' }}" step="0.1" placeholder="0">
                </div>
                <div class="form-group">
                    <label>Срок (мес.)</label>
                    <input type="number" name="mortgage_months" value="{{ prop.mortgage_months or '' }}" placeholder="0">
                </div>
            </div>
            
            <div class="form-group">
                <label>Льготный период (мес.)</label>
                <input type="number" name="mortgage_grace_period" value="{{ prop.mortgage_grace_period or '' }}" placeholder="0">
            </div>
        </div>
        
        <div class="form-section">
            <div class="form-section-title">
                <i class="bi bi-calendar-check"></i> Рассрочка
            </div>
            
            <div class="form-row">
                <div class="form-group">
                    <label>Первый взнос (%)</label>
                    <input type="number" name="installment_down_payment" value="{{ prop.installment_down_payment or '' }}" step="0.1" placeholder="0">
                </div>
                <div class="form-group">
                    <label>Срок (мес.)</label>
                    <input type="number" name="installment_months" value="{{ prop.installment_months or '' }}" placeholder="0">
                </div>
            </div>
            
            <div class="form-group">
                <label>Льготный период (мес.)</label>
                <input type="number" name="installment_grace_period" value="{{ prop.installment_grace_period or '' }}" placeholder="0">
            </div>
        </div>
        
        <div class="form-section">
            <div class="form-section-title">
                <i class="bi bi-card-text"></i> Описание
            </div>
            
            <div class="form-group">
                <label>Описание объекта</label>
                <textarea name="description" placeholder="Расскажите о своём объекте...">{{ prop.description or '' }}</textarea>
            </div>
        </div>
        
        <div class="form-section">
            <div class="form-section-title">
                <i class="bi bi-telephone"></i> Контакты
            </div>
            
            <div class="form-group">
                <label>Телефон</label>
                <input type="tel" name="phone" value="{{ prop.phone or '' }}" placeholder="+998 XX XXX XX XX">
            </div>
        </div>
    </form>
    
    <div class="submit-container">
        <button type="submit" form="editForm" class="submit-btn" id="submitBtn">
            <i class="bi bi-check-lg"></i>
            Сохранить изменения
        </button>
    </div>
    
    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();
        
        const form = document.getElementById('editForm');
        const submitBtn = document.getElementById('submitBtn');
        const successMsg = document.getElementById('successMsg');
        const discountsContainer = document.getElementById('discounts-container');
        const discountsHidden = document.getElementById('discounts-hidden');
        
        let discountRowId = 0;
        
        function addDiscountRow(paymentPercent = '', discountPercent = '') {
            const row = document.createElement('div');
            row.className = 'discount-row';
            row.id = 'discount-row-' + discountRowId;
            row.innerHTML = `
                <div>
                    <label>От % оплаты</label>
                    <input type="number" class="discount-payment" value="${paymentPercent}" placeholder="100" min="0" max="100" step="1" onchange="updateDiscountsHidden()">
                </div>
                <div>
                    <label>Скидка %</label>
                    <input type="number" class="discount-value" value="${discountPercent}" placeholder="5" min="0" max="100" step="0.1" onchange="updateDiscountsHidden()">
                </div>
                <button type="button" class="remove-discount-btn" onclick="removeDiscountRow(${discountRowId})">
                    <i class="bi bi-trash"></i>
                </button>
            `;
            discountsContainer.appendChild(row);
            discountRowId++;
            updateDiscountsHidden();
        }
        
        function removeDiscountRow(id) {
            const row = document.getElementById('discount-row-' + id);
            if (row) {
                row.remove();
                updateDiscountsHidden();
            }
        }
        
        function updateDiscountsHidden() {
            const rows = discountsContainer.querySelectorAll('.discount-row');
            const discounts = [];
            rows.forEach(row => {
                const payment = row.querySelector('.discount-payment').value;
                const discount = row.querySelector('.discount-value').value;
                if (payment || discount) {
                    discounts.push({
                        payment_percent: parseFloat(payment) || 0,
                        discount_percent: parseFloat(discount) || 0
                    });
                }
            });
            discountsHidden.value = JSON.stringify(discounts);
        }
        
        function loadExistingDiscounts() {
            const existingData = discountsHidden.value;
            if (existingData && existingData.trim() !== '') {
                try {
                    const discounts = JSON.parse(existingData);
                    if (Array.isArray(discounts)) {
                        discounts.forEach(d => {
                            addDiscountRow(d.payment_percent || '', d.discount_percent || '');
                        });
                    }
                } catch (e) {
                    const textMatch = existingData.match(/(\d+)%\s*при\s*(\d+)%/g);
                    if (textMatch) {
                        textMatch.forEach(match => {
                            const nums = match.match(/(\d+)/g);
                            if (nums && nums.length >= 2) {
                                addDiscountRow(nums[1], nums[0]);
                            }
                        });
                    }
                }
            }
            if (discountsContainer.children.length === 0) {
                addDiscountRow();
            }
        }
        
        loadExistingDiscounts();
        
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            updateDiscountsHidden();
            
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<i class="bi bi-hourglass-split"></i> Сохранение...';
            
            const formData = new FormData(form);
            const data = Object.fromEntries(formData.entries());
            
            try {
                const response = await fetch('{{ url_for("webapp_user_property_save", property_id=prop.id) }}?tg_id={{ tg_id }}', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(data)
                });
                
                if (response.ok) {
                    successMsg.style.display = 'block';
                    successMsg.classList.remove('error-message');
                    successMsg.textContent = 'Изменения сохранены!';
                    
                    setTimeout(() => {
                        successMsg.style.display = 'none';
                    }, 2000);
                } else {
                    throw new Error('Save failed');
                }
            } catch (error) {
                successMsg.style.display = 'block';
                successMsg.classList.add('error-message');
                successMsg.textContent = 'Ошибка сохранения';
                
                setTimeout(() => {
                    successMsg.style.display = 'none';
                }, 2000);
            }
            
            submitBtn.disabled = false;
            submitBtn.innerHTML = '<i class="bi bi-check-lg"></i> Сохранить изменения';
        });
    </script>
</body>
</html>
