name: Deploy to Production Server

on:
  push:
    branches:
      - main
  workflow_dispatch:  # Allows manual trigger from GitHub Actions tab

jobs:
  deploy:
    name: Deploy to Server
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Deploy to server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            echo "🚀 Starting deployment..."
            
            # Navigate to application directory
            cd /home/app || exit 1
            
            # Backup current version (optional)
            echo "📦 Creating backup..."
            timestamp=$(date +%Y%m%d_%H%M%S)
            mkdir -p backups
            cp -r .git backups/backup_$timestamp/ 2>/dev/null || true
            
            # Fetch and pull latest changes
            echo "📥 Pulling latest changes from GitHub..."
            git fetch origin main
            git reset --hard origin/main
            
            # Check if requirements.txt changed
            if git diff HEAD@{1} HEAD --name-only | grep -q "requirements.txt"; then
             sudo systemctl restart bot
            sudo systemctl status bot --no-pager
            # sleep 2
            # nohup python bot.py > /var/log/bot.log 2>&1 &
            
            # Option 4: Using screen or tmux (uncomment if needed)
            # screen -S bot -X quit || true
            # sleep 2
            # screen -dmS bot python bot.py
            
            echo "✅ Deployment completed successfully!"
            echo "📊 Current commit: $(git rev-parse --short HEAD)"
            
      - name: Notify deployment status
        if: always()
        run: |
          if [ ${{ job.status }} == 'success' ]; then
            echo "✅ Deployment successful"
          else
            echo "❌ Deployment failed"
          fi
